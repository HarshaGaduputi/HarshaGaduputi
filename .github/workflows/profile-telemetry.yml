name: Profile Telemetry

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Generate 2D contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: HarshaGaduputi

          filename: assets/activity-calendar.svg

          template: classic
          base: ""

          # 2D contribution calendar
          plugin_calendar: yes
          plugin_calendar_limit: 1

          config_timezone: Asia/Kolkata
          config_output: svg
          config_display: large

          committer_message: "chore: refresh profile telemetry [skip ci]"

          extras_css: |
            svg {
              background: #000000 !important;
              color: #B7A7A9 !important;
            }

            h1,
            h2,
            h3 {
              color: #F6ECE3 !important;
            }

            :root {
              --color-calendar-graph-day-bg: #000000;
              --color-calendar-graph-day-border: #91766E;

              --color-calendar-graph-day-L1-bg: #3D312E;
              --color-calendar-graph-day-L2-bg: #6D5650;
              --color-calendar-graph-day-L3-bg: #91766E;
              --color-calendar-graph-day-L4-bg: #F6ECE3;

              --color-calendar-graph-day-L1-border: #3D312E;
              --color-calendar-graph-day-L2-border: #6D5650;
              --color-calendar-graph-day-L3-border: #91766E;
              --color-calendar-graph-day-L4-border: #F6ECE3;
            }

            .calendar .day {
              outline: none !important;
            }

            .field,
            text {
              color: #B7A7A9 !important;
              fill: #B7A7A9 !important;
            }
