name: Profile Telemetry

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution-terrain:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution terrain
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: HarshaGaduputi
          filename: assets/activity-calendar.svg

          template: classic
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: Asia/Kolkata
          config_output: svg
          config_animations: yes

          committer_message: "chore: refresh profile telemetry [skip ci]"
