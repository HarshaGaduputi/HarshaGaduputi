name: Profile Telemetry

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Generate 2D contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HarshaGaduputi
          filename: assets/activity-calendar-2d.svg
          template: classic
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: Asia/Kolkata
          config_output: svg
          config_display: large
          committer_message: "chore: refresh profile telemetry [skip ci]"
          extras_css: |
            svg {
              background: #000000 !important;
              color: #B7A7A9 !important;
            }
            h1, h2, h3 {
              color: #F6ECE3 !important;
            }
            .field, text {
              color: #B7A7A9 !important;
              fill: #B7A7A9 !important;
            }
            rect.day[fill="#ebedf0"] {
              fill: #000000 !important;
            }
            rect.day[fill="#9be9a8"] {
              fill: #91766E !important;
            }
            rect.day[fill="#40c463"] {
              fill: #B7A7A9 !important;
            }
            rect.day[fill="#30a14e"] {
              fill: #F6ECE3 !important;
            }
            rect.day[fill="#216e39"] {
              fill: #FFFFFF !important;
            }
            .calendar .day {
              outline: 1px solid #2A2422 !important;
              outline-offset: -1px;
            }

      - name: Generate languages distribution
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HarshaGaduputi
          filename: assets/languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_skipped: HarshaGaduputi/HarshaGaduputi, HarshaGaduputi/nitrostack
          plugin_languages_colors: >-
            0:#91766E,
            1:#B7A7A9,
            2:#F6ECE3,
            3:#FFFFFF,
            4:#6F5B55,
            5:#D7C9C0
          config_timezone: Asia/Kolkata
          config_output: svg
          committer_message: "chore: refresh language metrics [skip ci]"
          extras_css: |
            svg {
              background: #000000 !important;
              color: #B7A7A9 !important;
            }
            h1, h2, h3 {
              color: #F6ECE3 !important;
            }
            .field, text {
              color: #B7A7A9 !important;
              fill: #B7A7A9 !important;
            }
