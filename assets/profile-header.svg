<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#B7A7A9" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1200" height="340" rx="16" fill="#000000"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Geometric elements -->
  <path d="M 0 324 Q 300 360, 600 324 T 1200 324 L 1200 340 L 0 340 Z" fill="#91766E" opacity="0.2"/>
  <circle cx="1100" cy="80" r="150" fill="none" stroke="#91766E" stroke-width="1" opacity="0.3" stroke-dasharray="4 8"/>
  <circle cx="1100" cy="80" r="100" fill="none" stroke="#91766E" stroke-width="1" opacity="0.2"/>

  <!-- Left Content -->
  <g transform="translate(60, 70)" font-family="Helvetica, Arial, sans-serif">
    <!-- Super title -->
    <text x="0" y="0" fill="#B7A7A9" font-size="12" font-weight="bold" letter-spacing="4">HARSHA / ENGINEERING OBSERVATORY</text>
    
    <!-- Main title -->
    <text x="0" y="55" fill="#FFFFFF" font-size="52" font-weight="800" letter-spacing="-1">Harsha Gaduputi</text>
    
    <!-- Subtitle -->
    <text x="0" y="95" fill="#F6ECE3" font-size="24" font-weight="500">Full-stack engineering × applied AI</text>
    
    <!-- Supporting text -->
    <text x="0" y="130" fill="#B7A7A9" font-size="14" font-weight="400" letter-spacing="2">software · data · machine learning · language systems</text>

    <!-- Pills -->
    <g transform="translate(0, 180)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#91766E" fill-opacity="0.2" stroke="#91766E" stroke-width="1"/>
      <text x="80" y="21" fill="#F6ECE3" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">PRODUCT-MINDED</text>
      
      <!-- Pill 2 -->
      <rect x="175" y="0" width="180" height="32" rx="16" fill="#91766E" fill-opacity="0.2" stroke="#91766E" stroke-width="1"/>
      <text x="265" y="21" fill="#F6ECE3" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">END-TO-END BUILDER</text>
      
      <!-- Pill 3 -->
      <rect x="370" y="0" width="160" height="32" rx="16" fill="#91766E" fill-opacity="0.2" stroke="#91766E" stroke-width="1"/>
      <text x="450" y="21" fill="#F6ECE3" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">ALWAYS LEARNING</text>
    </g>
  </g>

  <!-- Right Side Diagram (Network/System) -->
  <g transform="translate(900, 170)" font-family="monospace">
    <!-- Lines from center -->
    <line x1="0" y1="0" x2="-80" y2="-60" stroke="#B7A7A9" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="80" y2="-60" stroke="#B7A7A9" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="100" y2="20" stroke="#B7A7A9" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="40" y2="80" stroke="#B7A7A9" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="-70" y2="60" stroke="#B7A7A9" stroke-width="1.5" opacity="0.6"/>

    <!-- Connections between nodes -->
    <line x1="-80" y1="-60" x2="80" y2="-60" stroke="#91766E" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 2"/>
    <line x1="80" y1="-60" x2="100" y2="20" stroke="#91766E" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 2"/>
    <line x1="100" y1="20" x2="40" y2="80" stroke="#91766E" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 2"/>
    <line x1="40" y1="80" x2="-70" y2="60" stroke="#91766E" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 2"/>
    <line x1="-70" y1="60" x2="-80" y2="-60" stroke="#91766E" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 2"/>

    <!-- Central Node -->
    <circle cx="0" cy="0" r="14" fill="#F6ECE3"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#F6ECE3" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="4" fill="#000000"/>

    <!-- WEB Node -->
    <g transform="translate(-80, -60)">
      <circle cx="0" cy="0" r="8" fill="#91766E"/>
      <rect x="-18" y="-28" width="36" height="16" rx="2" fill="#000000" stroke="#B7A7A9" stroke-width="1"/>
      <text x="0" y="-17" fill="#B7A7A9" font-size="10" text-anchor="middle">WEB</text>
    </g>

    <!-- ML Node -->
    <g transform="translate(80, -60)">
      <circle cx="0" cy="0" r="8" fill="#91766E"/>
      <rect x="-14" y="-28" width="28" height="16" rx="2" fill="#000000" stroke="#B7A7A9" stroke-width="1"/>
      <text x="0" y="-17" fill="#B7A7A9" font-size="10" text-anchor="middle">ML</text>
    </g>

    <!-- DATA Node -->
    <g transform="translate(100, 20)">
      <circle cx="0" cy="0" r="8" fill="#91766E"/>
      <rect x="14" y="-8" width="40" height="16" rx="2" fill="#000000" stroke="#B7A7A9" stroke-width="1"/>
      <text x="34" y="3" fill="#B7A7A9" font-size="10" text-anchor="middle">DATA</text>
    </g>

    <!-- SYSTEMS Node -->
    <g transform="translate(40, 80)">
      <circle cx="0" cy="0" r="8" fill="#91766E"/>
      <rect x="-28" y="14" width="56" height="16" rx="2" fill="#000000" stroke="#B7A7A9" stroke-width="1"/>
      <text x="0" y="25" fill="#B7A7A9" font-size="10" text-anchor="middle">SYSTEMS</text>
    </g>

    <!-- NLP Node -->
    <g transform="translate(-70, 60)">
      <circle cx="0" cy="0" r="8" fill="#91766E"/>
      <rect x="-38" y="14" width="32" height="16" rx="2" fill="#000000" stroke="#B7A7A9" stroke-width="1"/>
      <text x="-22" y="25" fill="#B7A7A9" font-size="10" text-anchor="middle">NLP</text>
    </g>
  </g>
</svg>
