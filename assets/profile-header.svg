<svg
  width="1200"
  height="340"
  viewBox="0 0 1200 340"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path
        d="M32 0H0V32"
        stroke="#B7A7A9"
        stroke-opacity="0.075"
        stroke-width="1"
      />
    </pattern>

    <linearGradient
      id="fade"
      x1="0"
      y1="0"
      x2="1200"
      y2="340"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.68" stop-color="#000000"/>
      <stop offset="1" stop-color="#91766E"/>
    </linearGradient>

    <linearGradient
      id="signal"
      x1="70"
      y1="0"
      x2="690"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#91766E"/>
      <stop offset="0.55" stop-color="#B7A7A9"/>
      <stop offset="1" stop-color="#F6ECE3"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect
    x="1"
    y="1"
    width="1198"
    height="338"
    rx="28"
    fill="url(#fade)"
    stroke="#91766E"
    stroke-opacity="0.65"
    stroke-width="2"
  />

  <rect
    x="1"
    y="1"
    width="1198"
    height="338"
    rx="28"
    fill="url(#grid)"
  />

  <!-- ambient geometry -->
  <circle
    cx="1042"
    cy="170"
    r="138"
    fill="#91766E"
    fill-opacity="0.09"
    filter="url(#blur)"
  />

  <circle
    cx="1042"
    cy="170"
    r="112"
    stroke="#91766E"
    stroke-opacity="0.40"
  />

  <circle
    cx="1042"
    cy="170"
    r="76"
    stroke="#B7A7A9"
    stroke-opacity="0.30"
  />

  <circle
    cx="1042"
    cy="170"
    r="39"
    stroke="#F6ECE3"
    stroke-opacity="0.45"
  />

  <!-- top system labels -->
  <text
